# Lint gate. Separate from tests.yml (the reference-environment test gate) and
# from platform.yml (cross-platform + dependency audit) because it answers a
# third question and needs none of their setup: no torch, no weights, no
# dataset, so it finishes in seconds and gives the fastest signal on a PR.
#
# What it enforces is in ruff.toml, which explains each choice. In short: the
# rules that find defects are on, the ones that have opinions about dense
# numeric code are off, and scripts/, tests/ and experiments/ get pyflakes
# only -- by the same policy .coderabbit.yaml already states for scripts/.

name: lint

on:
  push:
    branches: [main, phase2]
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      # Pinned, and pinned to the same version as .pre-commit-config.yaml.
      # An unpinned linter turns someone else's release into a red build on an
      # unrelated PR; the two must move together, deliberately.
      - name: Install ruff
        run: pip install ruff==0.12.0
      - name: ruff check
        run: ruff check --output-format=github .

  mypy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      # The real dependencies, not just mypy. numpy ships inline types and
      # torch ships stubs; without them every import resolves to Any under
      # ignore_missing_imports and the check passes while verifying nothing.
      # warn_unused_ignores would catch that -- the eight type: ignore
      # comments in driftsense/ would go unused and fail the run -- but it is
      # better to give the checker the types than to rely on the tripwire.
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Install mypy
        run: pip install mypy==1.17.1
      # No arguments: files, python_version and the rest come from
      # [tool.mypy] in pyproject.toml, so this command and a local `mypy` are
      # the same check.
      - name: mypy
        run: mypy
