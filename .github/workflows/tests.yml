name: tests

on:
  push:
    branches: [main, phase2]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Run test suite
        run: python -m pytest -q
      - name: Validate register.py end-to-end against the output contract
        run: python scripts/check_register_contract.py
      # The control that would have caught the vst break. PR #20 added
      # driftsense/vst.py and PR #26 authored the closed ship manifest that
      # has to name it; each was green alone and red together, and nothing
      # ran the builder between the merge and the discovery. pytest alone is
      # not enough here -- the gate also proves the build is reproducible and
      # that nothing denied (notably .agents/) reached the archive.
      - name: Release gate (buildable, reproducible, no denied content)
        run: python scripts/release_gate.py
