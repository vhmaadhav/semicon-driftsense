version: 2
updates:
  # Runtime and test dependencies. requirements.txt is a frozen pip freeze
  # from a CPU-only PyTorch 3.11 environment; treat every bump as needing a
  # rerun of the full suite plus the release gate before merge.
  - package-ecosystem: pip
    directory: "/"
    # `directory: "/"` scans RECURSIVELY. The options reference is explicit:
    # "all directories and files in the specified directory are included in
    # the update scan unless excluded by this option". So the root entry
    # reaches every requirements.txt in the repository, not just the one
    # beside it -- which is why phase1/requirements.txt kept being updated.
    #
    # exclude-paths is the documented way to narrow that. The previous attempt
    # here used `directories: ["/", "!/phase1"]`; `directories` supports the
    # `*` wildcard but has no negation operator, so that entry was never valid
    # syntax and silently did nothing. PRs #126 and #127 arrived against
    # phase1/ immediately after it merged, which is how it was caught.
    exclude-paths:
      # An archive: one commit dated 2026-09-03, DENY-listed out of the
      # submission by scripts/build_submission_zip.py as an "archived Phase 1
      # duplicate", never run by CI. Its requirements.txt records the
      # environment that WAS used -- phase1/README.md cites it as "full pip
      # freeze of the dev environment" -- so bumping it edits a historical
      # record rather than making anything safer.
      - "phase1/**"
      # Vendored third-party trees whose upstream terms are undetermined (see
      # NOTICE). generator/ has its own entry below, and the reference warns
      # that directories must not overlap between entries -- without this the
      # recursive root scan reaches it as well.
      - "generator/**"
      - "generator_i4c/**"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # These labels have to exist in the repository first. They did not, so
    # every Dependabot PR opened so far arrived unlabelled and the routing
    # below was silently doing nothing -- the commit-message prefixes and the
    # groups worked, which made it look like the whole block was in effect.
    # `dependencies`, `ci` and `generator` now exist.
    labels:
      - dependencies
    commit-message:
      prefix: "deps"
    groups:
      # torch and torchvision must move together or the import breaks.
      torch:
        patterns:
          - torch
          - torchvision
      # Everything else that is not a decoder can batch into one PR.
      minor-and-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - torch
          - torchvision
          - opencv-python-headless
          - pillow
          - gdstk

  # The image and GDSII decoders reached by untrusted input (see SECURITY.md).
  # Deliberately ungrouped so a CVE fix arrives as its own reviewable PR.
  - package-ecosystem: pip
    directory: "/generator"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - generator
    commit-message:
      prefix: "deps(generator)"

  - package-ecosystem: github-actions
    # Workflows only ever live in .github/workflows, so there is nothing for
    # this one to over-discover. Kept singular deliberately.
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci"
